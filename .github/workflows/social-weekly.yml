name: Publish weekly report to Instagram

# Posts the weekly report carousel that deploy.yml (publish_social=true) hosts
# under /social/weekly/<saturday>/. Dispatched by deploy.yml after the Monday
# fixtures refresh, or run by hand. Re-runs are safe: a week whose stats link
# is already in a recent caption is skipped.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Saturday (YYYY-MM-DD); blank = most recent Saturday"
        required: false
        type: string
      dry_run:
        description: "Run every check but don't publish"
        required: false
        type: boolean
        default: true
      force:
        description: "Publish even if under 95% of the week's results are in"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: social-weekly
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    environment: social
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eo pipefail
          args=()
          if [ -n "$WEEK" ]; then
            if ! printf '%s' "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Invalid week: expected YYYY-MM-DD, got '$WEEK'"
              exit 1
            fi
            args+=(--week "$WEEK")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -m rugby.social.publish_instagram "${args[@]}"
